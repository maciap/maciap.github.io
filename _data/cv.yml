- title: Research Experience
  type: time_table
  contents:
    - title: Postdoctoral Researcher
      institution: Scuola Normale Superiore, Pisa, Italy
      department: Data Science and Human-centered AI Group & KDD Lab (PI Prof. Fosca Giannotti)
      year: 2025 – now
      description:
        - Research on explainable and trustworthy AI, with a focus on large language model behavior and applications to scientific discovery.
        - Work Package and Task Leader in the ERC Proof of Concept project ILLUME-4-Science.
        - Contributor to technology transfer (TRL 3 to TRL 5) and industrial collaborations, including ongoing work with Accenture on evaluation metrics for large language model explanations.

    - title: Postdoctoral Researcher
      institution: Aalto University, Espoo, Finland
      department: Department of Computer Science (PI Prof. Heikki Mannila)
      year: 2023 – 2025
      description:
        - Research on dimensionality reduction, low-rank approximation, clustering, and linear-algebraic methods for machine learning.
        - Industrial collaboration with Helen Oy and House of AI on forecasting district-heating consumption using real-world data.

    - title: Doctoral Researcher
      institution: Aalto University, Espoo, Finland
      department: Data Mining Group (PI Prof. Aristides Gionis)
      year: 2019 – 2023
      description:
        - Research on efficient and trustworthy algorithms for data mining and machine learning, within the Academy of Finland project Model Management Systems — Machine Learning meets Database Systems (MLDB).
        - Research visits to Aarhus University, Denmark (2022, invited by Prof. Panagiotis Karras) and KTH Royal Institute of Technology, Sweden (2023, invited by Prof. Aristides Gionis).

    - title: Research Intern and Master's Thesis Student
      institution: ISI Foundation, Turin, Italy
      department: Algorithmic Data Analytics Group (PI Dr. Francesco Bonchi)
      year: 2018 – 2019
      description:
        - Research on temporal network analysis, focusing on extracting dense substructures and understanding spreading dynamics.


- title: Research Projects
  type: time_table
  contents:
    - title: ILLUME-4-Science — ERC Proof of Concept (Horizon Europe)
      institution: Scuola Normale Superiore and University of Pisa
      year: 2026 – 2027
      description:
        - Work Package Leader (WP1, Demonstrating Scientific Impact) and Task Leader (risk factor identification; conversational interface for exploring explanations).
        - Explainable AI for scientific and biomedical applications, in collaboration with partners including the University of Pisa and the German Cancer Research Center.

    - title: XAI — Science and Technology for the Explanation of AI Decision Making (ERC Advanced Grant)
      institution: Scuola Normale Superiore
      year: 2025
      description:
        - Postdoctoral research on interpretability and explainability of machine learning models.

    - title: FAIR — Future Artificial Intelligence Research (PNRR), Spoke 1 "Human-Centered AI"
      institution: Scuola Normale Superiore
      year: 2025
      description:
        - Research on human-centered, trustworthy and explainable AI.
        - "Technology transfer: development and validation of ILLUME 1.0, an open-source explainable AI library for scientific and biomedical applications, and of an end-to-end pipeline for predicting response to anticancer drugs from transcriptomics data (TRL 3 to TRL 5)."

    - title: Industrial collaboration with Accenture
      institution: Scuola Normale Superiore
      year: 2026 – now
      description:
        - Evaluation metrics for the outputs of explainable AI methods for large language models.

    - title: Industrial collaboration with Helen Oy and House of AI
      institution: Aalto University
      year: 2024 – 2025
      description:
        - Machine learning and data analysis for the energy sector, with a focus on district-heating time series and consumption forecasting.

    - title: MLDB — Model Management Systems, Machine Learning meets Database Systems (Academy of Finland)
      institution: Aalto University and University of Helsinki
      year: 2019 – 2023
      description:
        - Integrating machine learning functionality into database management systems; contributed to the development of the algorithmic methods.

